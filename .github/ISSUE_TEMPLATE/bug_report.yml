name: Bug Report
description: Create a report to help us reproduce and fix an issue in DockDrop.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: input
    id: device_model
    attributes:
      label: Device Model
      description: What phone model are you using? (e.g. Samsung Galaxy A14, Google Pixel 8)
      placeholder: e.g. Samsung Galaxy A14 5G
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android OS Version
      description: What Android version is installed? (e.g. Android 14, Android 15)
      placeholder: e.g. Android 15 (One UI 7.0)
    validations:
      required: true
  - type: input
    id: drive_details
    attributes:
      label: External Drive & Filesystem
      description: What SSD/drive and filesystem are you using?
      placeholder: e.g. Samsung T7 Shield 1TB, exFAT
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Plug in SSD
        2. Tap "Start Drop"
        3. Lock screen while copy is running
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace / Screenshots
      description: Paste any log output or error screen text from DockDrop Settings -> Export Logs.
      render: shell
