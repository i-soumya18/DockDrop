name: Feature Request
description: Suggest an idea or enhancement for DockDrop.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        DockDrop is strictly an **offline-first, zero-cloud** utility. Features must adhere to CLAUDE.md principles (no cloud sync, no background scheduling, no telemetry, read-only sources).
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear description of the limitation or problem you are encountering.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've evaluated.
  - type: checkboxes
    id: compliance
    attributes:
      label: Core Guarantees Compliance
      description: Confirm that your feature request complies with DockDrop's core rules:
      options:
        - label: This feature requires NO internet, cloud sync, or external server APIs.
          required: true
        - label: This feature does NOT delete or modify source files on the phone.
          required: true
